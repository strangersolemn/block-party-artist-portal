<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acid Frogs · On-chain Traits Preview</title>
<style>
  :root {
    --jade: #2e5230;
    --larimar: #a6d1fe;
    --hematite: #373737;
    --pearl: #d1d1d1;
    --topaz: #eed248;
    --ruby: #d22a46;
    --amethyst: #9b56d0;
    --bg: #000;
    --txt: #eee;
    --txt-dim: rgba(255,255,255,0.55);
    --txt-faint: rgba(255,255,255,0.35);
    --border: rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:0.01em;min-height:100vh}
  .wrap{max-width:1200px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:24px;letter-spacing:6px;margin:0 0 4px;font-weight:700}
  .sub{font-size:11px;letter-spacing:3px;color:var(--txt-dim);text-transform:uppercase}

  .featured{
    margin-top:20px;
    display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px;
    align-items:start;
  }
  @media (max-width:760px){ .featured{grid-template-columns:1fr} }

  .frog-stage{
    position:relative;aspect-ratio:1/1;
    background:#0a0b0d;border:1px solid var(--border);border-radius:10px;
    overflow:hidden;
    box-shadow:inset 0 2px 8px rgba(0,0,0,0.6);
  }
  .frog-stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .frog-stage .loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--txt-faint);font-size:11px;letter-spacing:2px;
    background:rgba(0,0,0,0.5);
  }
  .frog-stage .loading.hidden{display:none}

  .info-panel{
    background:linear-gradient(180deg,#1a1b1d 0%, #131517 100%);
    border:1px solid var(--border);border-radius:10px;padding:16px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .info-rows{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:12px;line-height:1.5}
  .info-rows .k{color:var(--txt-faint);text-transform:uppercase;font-size:10px;letter-spacing:1.5px}
  .info-rows .v{color:var(--txt);font-family:"SF Mono",monospace}
  .gem-pill{
    display:inline-block;padding:2px 10px;border-radius:4px;
    font-size:11px;font-weight:700;letter-spacing:1px;
    color:#000;text-transform:uppercase;
  }
  .tier{
    font-size:9px;letter-spacing:2px;padding:2px 6px;border-radius:3px;
    text-transform:uppercase;font-weight:700;
  }
  .tier-common    {color:#9d9;background:rgba(150,255,150,0.12);border:1px solid rgba(150,255,150,0.3)}
  .tier-medium    {color:#9cf;background:rgba(150,200,255,0.12);border:1px solid rgba(150,200,255,0.3)}
  .tier-legendary {color:var(--amethyst);background:rgba(155,86,208,0.15);border:1px solid rgba(155,86,208,0.4)}
  .tier-mythical  {color:var(--topaz);background:rgba(238,210,72,0.15);border:1px solid rgba(238,210,72,0.5);animation:mythGlow 1.6s ease-in-out infinite alternate}
  @keyframes mythGlow{to{box-shadow:0 0 12px rgba(238,210,72,0.6)}}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .btn{
    background:linear-gradient(180deg,#2a2c30 0%,#16171a 100%);
    border:1px solid var(--border);color:var(--txt);
    font:inherit;font-size:11px;font-weight:700;letter-spacing:2px;
    padding:10px 16px;border-radius:7px;cursor:pointer;text-transform:uppercase;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.04);transition:all .12s;
  }
  .btn:hover{border-color:rgba(255,255,255,0.25)}
  .btn.primary{border-color:var(--topaz);color:var(--topaz);box-shadow:inset 0 1px 0 rgba(255,255,255,0.04), 0 0 8px rgba(238,210,72,0.25)}

  .gem-picker{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
  .gem-btn{
    padding:6px 8px;border-radius:5px;border:1px solid rgba(255,255,255,0.12);
    cursor:pointer;font-size:10px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;font-family:inherit;color:#000;
  }
  .gem-btn.active{outline:2px solid #fff;outline-offset:2px}
  .gem-btn[data-gem="hematite"]{color:#fff}
  .gem-btn[data-gem="ruby"]{color:#fff}
  .gem-btn[data-gem="amethyst"]{color:#fff}

  .section-title{font-size:11px;letter-spacing:3px;color:var(--txt-faint);text-transform:uppercase;margin:32px 0 12px}

  .gallery{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
  }
  .card{
    background:linear-gradient(180deg,#1a1b1d 0%,#131517 100%);
    border:1px solid var(--border);border-radius:8px;padding:8px;
    cursor:pointer;transition:transform .12s, border-color .12s;
  }
  .card:hover{border-color:var(--topaz);transform:translateY(-2px)}
  .card .frog-tile{position:relative;aspect-ratio:1/1;background:#0a0b0d;border-radius:5px;overflow:hidden;margin-bottom:6px}
  .card .frog-tile canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .card .meta{font-size:9px;letter-spacing:0.5px;line-height:1.3}
  .card .meta .name{font-weight:700;color:var(--txt)}
  .card .meta .sub{color:var(--txt-faint);font-size:8px}

  .test-status{
    margin-top:24px;font-size:10px;letter-spacing:1.5px;font-family:"SF Mono",monospace;
    padding:10px 14px;background:#0a0b0d;border:1px solid var(--border);border-radius:6px;
    color:var(--txt-faint);
  }
  .test-status .live{color:#9d9}
  .test-status .err{color:#f88}
</style>
</head>
<body>
<div class="wrap">
  <h1>ACID FROGS · ON-CHAIN PREVIEW</h1>
  <div class="sub">All sprites pulled live from Bitcoin · ordinals.com/content/{id}</div>

  <div class="featured">
    <div>
      <div class="frog-stage" id="stage">
        <canvas id="bgCanvas" width="500" height="500"></canvas>
        <canvas id="mainCanvas" width="500" height="500"></canvas>
        <div class="loading" id="loading">loading from chain…</div>
      </div>
      <div class="controls">
        <button class="btn primary" id="nextBtn">⟳ NEXT FROG</button>
        <button class="btn" id="lockBodyBtn">LOCK BODY OFF</button>
      </div>
      <div class="gem-picker" id="gem-picker">
        <!-- 7 gem buttons -->
      </div>
    </div>

    <div class="info-panel">
      <div class="info-rows" id="info">
        <div class="k">status</div><div class="v">click NEXT FROG to roll</div>
      </div>
    </div>
  </div>

  <div class="section-title">GALLERY · 12 RANDOM FROGS · CLICK TO FEATURE</div>
  <div class="gallery" id="gallery"></div>

  <div class="test-status" id="test-status">
    architecture · waiting for first roll
  </div>
</div>

<script>
// ============================================================================
// ON-CHAIN ASSET MANIFEST
// All inscriptions verified live on Bitcoin mainnet 2026-05-05.
// Master parent will reference these via /r/inscription/{id}/content.
// ============================================================================
const ORD = location.hostname.includes("ordinals.com") || location.pathname.startsWith("/content/")
  ? "" : "https://ordinals.com";

const BODIES = [
  { id: "0f752f44e73af70349e81d5428af4ab9a48749e0a356c1118d3d9307cf1a4a5ai0", name: "Jade",     hex: "#2e5230", tier: "common",     w: 58 },
  { id: "475de8098affe1457bfbd15bbcc881c3a1465aed81aa19c853a475abf3667dc2i4", name: "Larimar",  hex: "#a6d1fe", tier: "medium",     w: 12 },
  { id: "475de8098affe1457bfbd15bbcc881c3a1465aed81aa19c853a475abf3667dc2i5", name: "Hematite", hex: "#373737", tier: "medium",     w: 12 },
  { id: "475de8098affe1457bfbd15bbcc881c3a1465aed81aa19c853a475abf3667dc2i2", name: "Pearl",    hex: "#d1d1d1", tier: "medium",     w: 12 },
  { id: "10bc9405d6fc0d682b65d8cb2f970f065ab58aae3b8d495b859194cbb8ccbac1i2", name: "Ruby",     hex: "#d22a46", tier: "legendary",  w:  3 },
  { id: "475de8098affe1457bfbd15bbcc881c3a1465aed81aa19c853a475abf3667dc2i1", name: "Amethyst", hex: "#9b56d0", tier: "legendary",  w:  2 },
  { id: "475de8098affe1457bfbd15bbcc881c3a1465aed81aa19c853a475abf3667dc2i3", name: "Topaz",    hex: "#eed248", tier: "mythical",   w:  1 },
];

// HEADS — 49 total, 4 batch txids + 1 standalone Conehead Jade
const HEADS = [
  // Batch A · 56698bf4… · 7 heads
  ...["Peaky Blue","Peaky Brown","Sweatband Blue","Tribal Green","Plunger","Russian","Tribal Orange"]
    .map((name, i) => ({ id: `56698bf4d9ae87475765cec2e7d119e93b03e60ce6483bbb2577226fe1d4a537i${i}`, name })),
  // Batch B · a258f4f1… · 19 heads
  ...["Peaky Grey","Frog Green","Emporer","Wizard Blue","Gizmo","Crown","Tinfoil","Frog Blue Light","Pizza","Chicken","Mc D","Sailor","Bandana White","Frog Orange","Snap Blue","Frog Blue","Viking","Police","Gangster Crown"]
    .map((name, i) => ({ id: `a258f4f15fd760b22153f797cbab8e7d669d7f20f0f050f14aa96419532b09cbi${i}`, name })),
  // Batch C · 262ec0ed… · 19 heads
  ...["Rice","Snap Red","On Chain Beanie","Dunce","Crown","Propellor","Spike","Acid Beanie Blue","Snap Blue Light","BTC Bucket Orange","Runes Beanie","Fro","Rasta Crown","BTC Bucket Yellow","Sweatband Red","Sweatband Blue Light","Quiff Blonde","Acid Beanie Red","Headband"]
    .map((name, i) => ({ id: `262ec0ed4e98ee88210d33bce5a9615a9445004f6a28de56f8b34b4552d0b24di${i}`, name })),
  // Batch D · 34edafde… · 3 heads
  ...["Karen Bob","Slick Rick","Karen High"]
    .map((name, i) => ({ id: `34edafdee8ecac2dfbbb1dc294a4e8262dbafcb97afb7d0818db07cc3f91ff6bi${i}`, name })),
  // Body-locked specials
  { id: "728dfe7f99551f92fb7f8126ae1e71fc987696477fbd8622e87476bb08420deai1", name: "Conehead Jade", requires: { body: "Jade" } },
];

// EYES — ~26 total, 2 batches
const EYES = [
  ...["Xray","Dead Frog Low","Saucers","Lazy Low","Saucers Low","Dead Frog","Suss Low","Fear","Billy","Robo Low","Fiend Low","Aviator Red","Shiner Low","Aviator Pink","Fear Low","Nerd","Sad","Bored Low","Aviator Blue","Eye 19","Aviator Grey","VR Blue"]
    .map((name, i) => ({ id: `d5195b214c762dcea0e428ba0872167bf1c0ca8f30c891f388278c52139d5461i${i}`, name })),
  ...["Karen Side Eye","Karen Suss Low","VR Yellow","Karen Fiend"]
    .map((name, i) => ({ id: `0f474669fc0ace3c5a3507c397f6b7ff1911d9d487bc64a33d473dd0a1523d71i${i}`, name })),
];

// CLOTHING — 21 total, 3 batches
const CLOTHING = [
  ...["Soccer Scarf Red","Soccer Scarf Green","Soccer Scarf Blue"]
    .map((name, i) => ({ id: `c4213efe2e295fe8360e06947134fd2c0ad9cd8a062fc84135b67b5a6f1e80ffi${i}`, name })),
  ...["Smart Suit","Tribal Orange","BP Tee","Wife Beater","Flasher","Tribal Green"]
    .map((name, i) => ({ id: `ab7c1dcf676b04c234c18e56427827d5daa994258ad8ed2b8d594a51512218afi${i}`, name })),
  ...["Sweater Green","Sweater BTC","Sweater Grey","Sweater Red","Sweater Red Splatter","Sweater Blue","Sweater Ord","Track Red","Track Blue","Track Grey","Emporer","Bubble Blue"]
    .map((name, i) => ({ id: `a7fa12bee88b30d15eae39cf3d8327c5286cf157204552a89d458e264454bd33i${i}`, name })),
];

// MOUTHS — 2 of 4 (Neutral + Switch yet to inscribe)
const MOUTHS = [
  { id: "0f752f44e73af70349e81d5428af4ab9a48749e0a356c1118d3d9307cf1a4a5ai1", name: "Frog Grin" },
  { id: "0f752f44e73af70349e81d5428af4ab9a48749e0a356c1118d3d9307cf1a4a5ai2", name: "Frog Frown" },
];

// ============================================================================
// LOADER — fetches sprite as Image. Ordinals.com is same-origin if running
// inside an inscription, otherwise we hit ordinals.com directly. Cache by ID
// so a sprite isn't re-fetched.
// ============================================================================
const spriteCache = new Map();
function loadSprite(id) {
  if (spriteCache.has(id)) return spriteCache.get(id);
  const promise = new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = (e) => reject(new Error(`Failed to load ${id}`));
    img.src = `${ORD}/content/${id}`;
  });
  spriteCache.set(id, promise);
  return promise;
}

// ============================================================================
// TRAIT PICKER — weighted body, plus rule enforcement (Conehead Jade only on
// Jade body). For the mockup we use Math.random() seeded fresh each roll;
// in production the seed will be derived from the inscription's salt + parent.
// ============================================================================
function pickWeighted(arr) {
  const total = arr.reduce((s, x) => s + (x.w || 1), 0);
  let r = Math.random() * total;
  for (const x of arr) { r -= (x.w || 1); if (r <= 0) return x; }
  return arr[arr.length - 1];
}

function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pickHead(body) {
  // Filter out body-locked heads that don't match
  const eligible = HEADS.filter(h =>
    !h.requires?.body || h.requires.body === body.name
  );
  return pickRandom(eligible);
}

function pickTraits(forceBody = null) {
  const body = forceBody
    ? BODIES.find(b => b.name === forceBody) || BODIES[0]
    : pickWeighted(BODIES);
  const head = pickHead(body);
  const eyes = pickRandom(EYES);
  const clothing = pickRandom(CLOTHING);
  const mouth = pickRandom(MOUTHS);
  return { body, head, eyes, clothing, mouth };
}

// ============================================================================
// COMPOSITOR — draws the 5 layers in z-order: body → mouth → eyes → clothing
// → head. Background gets a tinted gradient based on the body's gem (placeholder
// until the visualizer / on-chain BG inscriptions land).
// ============================================================================
async function loadFrog(traits) {
  const [body, mouth, eyes, clothing, head] = await Promise.all([
    loadSprite(traits.body.id),
    loadSprite(traits.mouth.id),
    loadSprite(traits.eyes.id),
    loadSprite(traits.clothing.id),
    loadSprite(traits.head.id),
  ]);
  return { body, mouth, eyes, clothing, head };
}

function drawBg(ctx, hex, W, H) {
  // Radial gradient from gem colour at centre to black at edges
  const g = ctx.createRadialGradient(W/2, H*0.45, W*0.05, W/2, H*0.5, W*0.7);
  g.addColorStop(0, hex);
  g.addColorStop(0.6, hexShade(hex, 0.4));
  g.addColorStop(1, "#000");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function hexShade(hex, factor) {
  const h = hex.replace("#","");
  const r = parseInt(h.length===3?h[0]+h[0]:h.slice(0,2),16);
  const g = parseInt(h.length===3?h[1]+h[1]:h.slice(2,4),16);
  const b = parseInt(h.length===3?h[2]+h[2]:h.slice(4,6),16);
  return `rgb(${r*factor|0},${g*factor|0},${b*factor|0})`;
}

function drawFrogSprites(ctx, sprites, W, H) {
  // Layers, back to front: body, mouth, eyes, clothing, head
  for (const layer of [sprites.body, sprites.mouth, sprites.eyes, sprites.clothing, sprites.head]) {
    if (layer) ctx.drawImage(layer, 0, 0, W, H);
  }
}

// ============================================================================
// FEATURED FROG STATE
// ============================================================================
const stage = document.getElementById("stage");
const mainCanvas = document.getElementById("mainCanvas");
const mainCtx = mainCanvas.getContext("2d");
const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");
const loadingEl = document.getElementById("loading");
const infoEl = document.getElementById("info");
const galleryEl = document.getElementById("gallery");
const testEl = document.getElementById("test-status");
const nextBtn = document.getElementById("nextBtn");
const lockBtn = document.getElementById("lockBodyBtn");
const gemPicker = document.getElementById("gem-picker");

let lockedBody = null; // null = use weighted random; "Jade" / "Ruby" etc force

async function rollFeaturedFrog() {
  loadingEl.classList.remove("hidden");
  loadingEl.textContent = "loading from chain…";
  const t0 = performance.now();
  const traits = pickTraits(lockedBody);
  try {
    const sprites = await loadFrog(traits);
    const W = mainCanvas.width, H = mainCanvas.height;
    bgCtx.clearRect(0, 0, W, H);
    drawBg(bgCtx, traits.body.hex, W, H);
    mainCtx.clearRect(0, 0, W, H);
    drawFrogSprites(mainCtx, sprites, W, H);
    renderInfo(traits);
    loadingEl.classList.add("hidden");
    const ms = (performance.now() - t0) | 0;
    testEl.innerHTML = `<span class="live">live</span> · 5 sprites loaded in ${ms} ms · spriteCache size: ${spriteCache.size}`;
  } catch (e) {
    loadingEl.textContent = "error: " + e.message;
    testEl.innerHTML = `<span class="err">load failed:</span> ${e.message}`;
  }
}

function renderInfo(traits) {
  const body = traits.body;
  infoEl.innerHTML = `
    <div class="k">body</div>
    <div class="v">
      <span class="gem-pill" style="background:${body.hex}">${body.name}</span>
      <span class="tier tier-${body.tier}">${body.tier}</span>
    </div>
    <div class="k">head</div>
    <div class="v">${traits.head.name}${traits.head.requires ? ` <span class="tier tier-mythical">body-locked</span>` : ""}</div>
    <div class="k">eyes</div>
    <div class="v">${traits.eyes.name}</div>
    <div class="k">clothing</div>
    <div class="v">${traits.clothing.name}</div>
    <div class="k">mouth</div>
    <div class="v">${traits.mouth.name}</div>
    <div class="k">trait IDs</div>
    <div class="v" style="font-size:10px;opacity:.6">
      body  · ${traits.body.id.slice(0,8)}…<br>
      head  · ${traits.head.id.slice(0,8)}…<br>
      eyes  · ${traits.eyes.id.slice(0,8)}…<br>
      cloth · ${traits.clothing.id.slice(0,8)}…<br>
      mouth · ${traits.mouth.id.slice(0,8)}…
    </div>
  `;
}

// ============================================================================
// GEM PICKER UI — force a specific body
// ============================================================================
function buildGemPicker() {
  gemPicker.innerHTML = `
    <button class="gem-btn ${lockedBody === null ? "active" : ""}" data-gem="">RANDOM</button>
    ${BODIES.map(b => `
      <button class="gem-btn ${lockedBody === b.name ? "active" : ""}" data-gem="${b.name}" style="background:${b.hex}">${b.name}</button>
    `).join("")}
  `;
  gemPicker.querySelectorAll(".gem-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      lockedBody = btn.dataset.gem || null;
      buildGemPicker();
      lockBtn.textContent = lockedBody ? `LOCKED → ${lockedBody.toUpperCase()}` : "LOCK BODY OFF";
      rollFeaturedFrog();
    });
  });
}
lockBtn.addEventListener("click", () => {
  lockedBody = null;
  buildGemPicker();
  lockBtn.textContent = "LOCK BODY OFF";
  rollFeaturedFrog();
});
nextBtn.addEventListener("click", rollFeaturedFrog);

// ============================================================================
// GALLERY — 12 random frogs, click to feature
// ============================================================================
async function buildGallery() {
  galleryEl.innerHTML = "";
  for (let i = 0; i < 12; i++) {
    const traits = pickTraits();
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="frog-tile">
        <canvas width="500" height="500"></canvas>
      </div>
      <div class="meta">
        <div class="name"><span style="color:${traits.body.hex}">●</span> ${traits.body.name}</div>
        <div class="sub">${traits.head.name}</div>
      </div>
    `;
    galleryEl.appendChild(card);
    const tileCanvas = card.querySelector("canvas");
    const tileCtx = tileCanvas.getContext("2d");
    // Async render — don't block other tiles
    loadFrog(traits).then(sprites => {
      drawBg(tileCtx, traits.body.hex, 500, 500);
      drawFrogSprites(tileCtx, sprites, 500, 500);
    }).catch(e => {
      tileCtx.fillStyle = "#222";
      tileCtx.fillRect(0, 0, 500, 500);
      tileCtx.fillStyle = "#f88";
      tileCtx.font = "14px monospace";
      tileCtx.fillText("load failed", 20, 250);
    });
    // Click: feature this frog
    card.addEventListener("click", async () => {
      lockedBody = traits.body.name;
      buildGemPicker();
      lockBtn.textContent = `LOCKED → ${traits.body.name.toUpperCase()}`;
      // Re-render the featured area with these exact traits
      loadingEl.classList.remove("hidden");
      const sprites = await loadFrog(traits);
      const W = mainCanvas.width, H = mainCanvas.height;
      bgCtx.clearRect(0, 0, W, H);
      drawBg(bgCtx, traits.body.hex, W, H);
      mainCtx.clearRect(0, 0, W, H);
      drawFrogSprites(mainCtx, sprites, W, H);
      renderInfo(traits);
      loadingEl.classList.add("hidden");
      stage.scrollIntoView({behavior:"smooth", block:"start"});
    });
  }
}

// ============================================================================
// Init
// ============================================================================
(async () => {
  buildGemPicker();
  await rollFeaturedFrog();
  buildGallery();
})();
</script>
</body>
</html>
